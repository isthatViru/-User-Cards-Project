<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Cards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      padding: 40px 20px;
    }

    /* SEARCH INPUT */
    .ipt {
      width: 100%;
      max-width: 400px;
      padding: 12px 14px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      display: block;
      margin: 0 auto 40px auto;
      outline: none;
    }

    .ipt:focus {
      border-color: #333;
    }

    /* CARDS CONTAINER */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

   /* CARD */
.card {
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 6px 16px rgba(0,0,0,0.08);
  transition: transform 0.2s ease, box-shadow 0.2s ease;

  display: flex;
  flex-direction: column;
  position: relative;
}

/* IMAGE */
.pic {
  width: 100%;
  height: 200px;              /* slightly taller */
  object-fit: cover;
  object-position: center center;  /* 🔑 NOT top */
  display: block;
  background: #eee;
}


/* CARD BODY */
.cardBody {
  padding: 16px;
  text-align: center;
  flex-grow: 1;                 /* 🔑 equal height cards */
}

/* NAME */
.name {
  font-size: 16px;
  font-weight: 600;
  margin: 0 0 6px;
  color: #222;
}

/* INFO */
.info {
  font-size: 14px;
  color: #555;
  line-height: 1.5;
  margin: 0;
}

/* HOVER (subtle) */
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 28px rgba(0,0,0,0.14);
}
.card {
  max-width: 420px;     /* prevents image over-stretching */
  margin: 0 auto;       /* centers single card */
}


  </style>
</head>

<body>

  <!-- Search -->
  <input type="text" class="ipt" placeholder="Search users...">

  <!-- Cards injected by JS -->
  <div class="cards"></div>

  <!-- Your JS -->
  <script src="index.js"></script>

</body>
</html>
